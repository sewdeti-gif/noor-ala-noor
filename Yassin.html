<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سورة يس - نور على نور</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f8f5ed;
  color: #333;
  margin: 0;
  padding: 16px 10px;
  line-height: 2.2;
  text-align: center;
}

.surah {
  max-width: 750px;
  margin: auto;
  padding: 20px 14px;
  background: white;
  border-radius: 15px;
}

h1 { color: #5b4636; }

.riwaya {
  color: #806044;
  font-weight: bold;
}

.player {
  position: sticky;
  top: 0;
  background: #f8f5ed;
  padding: 12px 5px;
  border-radius: 12px;
  z-index: 2;
}

audio {
  width: 100%;
  display: block;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.button {
  display: inline-block;
  margin: 8px 4px;
  padding: 10px 18px;
  border: 0;
  border-radius: 20px;
  background: #806044;
  color: white;
  text-decoration: none;
  font-size: 16px;
  cursor: pointer;
}

.controls button {
  background: #176b43;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 16px;
}

.controls button:disabled {
  opacity: 0.5;
}

#playbackStatus {
  font-size: 14px;
  line-height: 1.7;
  color: #5b4636;
}

#quran {
  font-family: "Traditional Arabic", serif;
  font-size: 25px;
  line-height: 2.2;
  text-align: justify;
  padding: 12px;
}

.ayah { margin: 0 3px; }

.done { background: #39734b; }

#status {
  background: #f8f5ed;
  padding: 8px;
  border-radius: 10px;
}
</style>
</head>

<body>
<main class="surah">

<h1>سورة يس</h1>
<p class="riwaya">رواية ورش عن نافع</p>

<div class="player">
  <p>تلاوة الشيخ محمود خليل الحصري — ورش</p>

  <audio
    id="surahAudio"
    controls
    preload="auto"
  >
    <source src="./036.mp3" type="audio/mpeg">
    متصفحك لا يدعم تشغيل الصوت.
  </audio>

  <div class="controls">
    <button type="button" onclick="skipAudio(-30)">
      ⏪ رجوع 30 ثانية
    </button>

    <button type="button" onclick="skipAudio(30)">
      تقديم 30 ثانية ⏩
    </button>
  </div>

  <a
    class="button"
    href="./036.mp3"
    download="Yassin-Warsh.mp3"
  >
    ⬇ تنزيل التلاوة
  </a>

  <p id="playbackStatus" aria-live="polite">
    جارٍ تجهيز مشغّل التلاوة...
  </p>
</div>

<h2>المصحف</h2>
<div id="quran">جارٍ تحميل آيات سورة يس...</div>

<p id="status">لم تُسجَّل القراءة بعد.</p>

<button class="button done" onclick="markDone()">
  ✓ تمّت القراءة
</button>

<p>
  <a class="button" href="home.html">
    ← الرجوع إلى الورد
  </a>
</p>

<p>
  نور على نور<br>
  بالقرآن نرتقي، وبالصلاة يطمئن القلب.
</p>

</main>
