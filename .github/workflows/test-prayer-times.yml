name: Test Prayer Times

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Calculate Nouakchott prayer times
        run: |
          python prayer_scheduler.py \
            --lat 18.1138 \
            --lon -15.9438 \
            --tz Africa/Nouakchott \
            --date 2026-10-20
