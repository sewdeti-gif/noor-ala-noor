
name: Check International Subscribers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-subscribers:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check OneSignal subscribers
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python3 check_international_subscribers.py
