
name: Prayer Notifications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send last third night test
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: e41737a2-7d31-4a24-8a49-cbfc4e75aff0
        run: |
          set -euo pipefail

          if [ -z "${ONESIGNAL_REST_API_KEY:-}" ]; then
            echo "Missing OneSignal API key"
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          data = {
              "app_id": os.environ["ONESIGNAL_APP_ID"],
              "included_segments": ["Test Users"],
              "headings": {
                  "en": "🌙 قيام الليل | شوايل الآخرة"
              },
              "contents": {
                  "en": "🌙 دخل الثلث الأخير من الليل، وقت الدعاء والاستغفار والقيام. فلا تحرم نفسك من بركة هذا الوقت المبارك."
              },
              "url": "https://sewdeti-gif.github.io/noor-ala-noor/"
          }

          print(json.dumps(data, ensure_ascii=False))
          PY

          curl --fail-with-body --show-error \
            --request POST \
            --url "https://api.onesignal.com/notifications" \
            --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary @payload.json
