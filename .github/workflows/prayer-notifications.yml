
name: Prayer Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: read

concurrency:
  group: prayer-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Schedule pilot notifications
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: e41737a2-7d31-4a24-8a49-cbfc4e75aff0
          PILOT_USER_ID: c9796f0b-c6ae-4c13-9514-b11f629ff869
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          from prayer_scheduler import schedule_for_day

          key = os.environ["ONESIGNAL_REST_API_KEY"]
          app_id = os.environ["ONESIGNAL_APP_ID"]
          user_id = os.environ["PILOT_USER_ID"]

          def api_request(url, payload=None):
              headers = {
                  "Authorization": "Key " + key,
                  "Accept": "application/json",
              }
              method = "GET"
              data = None

              if payload is not None:
                  method = "POST"
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(
                      payload, ensure_ascii=False
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"OneSignal HTTP {error.code}"
                  ) from error

          user = api_request(
              "https://api.onesignal.com/apps/"
              + app_id
              + "/users/by/onesignal_id/"
              + user_id
          )

          properties = user.get("properties") or {}
          tags = properties.get("tags") or {}

          coords = tags.get("prayer_coords")
          tz_name = tags.get("prayer_timezone")

          if not coords or not tz_name:
              raise RuntimeError(
                  "Pilot subscriber location is missing. "
                  "No notifications scheduled."
              )

          lat, lon = map(float, coords.split(","))

          if not (-90 <= lat <= 90):
              raise ValueError("Invalid latitude")
          if not (-180 <= lon <= 180):
              raise ValueError("Invalid longitude")

          local_tz = ZoneInfo(tz_name)
          now = datetime.now(timezone.utc)
          today = now.astimezone(local_tz).date()

          events = schedule_for_day(
              today, lat, lon, tz_name
          )

          expected = 19 if today.weekday() == 4 else 15

          if len(events) != expected:
              raise RuntimeError(
                  "Unexpected notification count"
              )

          base_url = (
              "https://sewdeti-gif.github.io/"
              "noor-ala-noor/"
          )

          pages = {
              "fajr": "Yassin.html",
              "dhuhr": "Feth.html",
              "asr": "Naba.html",
              "maghrib": "Waqiah.html",
              "isha": "Mulk.html",
          }

          scheduled = 0
          skipped = 0

          for event in events:
              when = datetime.fromisoformat(
                  event["time"]
              ).astimezone(timezone.utc)

              if when <= now:
                  skipped += 1
                  continue

              event_id = event["id"]
              page = None

              for prefix, filename in pages.items():
                  if event_id.startswith(prefix + "_"):
                      page = filename
                      break

              unique_id = str(uuid.uuid5(
                  uuid.NAMESPACE_URL,
                  f"shawayil:{user_id}:{today}:{event_id}"
              ))

              payload = {
                  "app_id": app_id,
                  "target_channel": "push",
                  "include_aliases": {
                      "onesignal_id": [user_id]
                  },
                  "headings": {
                      "en": "🌿 شوايل الآخرة"
                  },
                  "contents": {
                      "en": event["message"]
                  },
                  "url": (
                      base_url + page
                      if page else base_url
                  ),
                  "send_after": when.strftime(
                      "%Y-%m-%d %H:%M:%S GMT"
                  ),
                  "idempotency_key": unique_id,
                  "name": f"{today} {event_id}",
              }

              result = api_request(
                  "https://api.onesignal.com/notifications",
                  payload,
              )

              if result.get("errors"):
                  raise RuntimeError(
                      str(result["errors"])
                  )

              if not result.get("id"):
                  raise RuntimeError(
                      "No notification ID returned"
                  )

              scheduled += 1
              print("Scheduled:", event_id)

          print("Date:", today)
          print("Expected:", expected)
          print("Scheduled:", scheduled)
          print("Skipped:", skipped)
          print("Mode: one pilot subscriber only")
          PY
