name: Build Noor Ala Noor Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check Quran files
        run: |
          test -f home.html
          test -f Yassin.html
          test -f Feth.html
          test -f Naba.html
          test -f Waqiah.html
          test -f Mulk.html
          echo "Quran files verified"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p android-app/app/src/main/java/com/noorala/noor
          mkdir -p android-app/app/src/main/assets

          cp home.html android-app/app/src/main/assets/
          cp Yassin.html android-app/app/src/main/assets/
          cp Feth.html android-app/app/src/main/assets/
          cp Naba.html android-app/app/src/main/assets/
          cp Waqiah.html android-app/app/src/main/assets/
          cp Mulk.html android-app/app/src/main/assets/

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NoorAlaNoor"
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.noorala.noor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.noorala.noor'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="نور على نور"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/noorala/noor/MainActivity.java <<'EOF'
          package com.noorala.noor;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(true);

                  setContentView(webView);

                  webView.loadUrl(
                      "https://sewdeti-gif.github.io/noor-ala-noor/home.html"
                  );
              }
          }
          EOF

      - name: Build APK
        working-directory: android-app
        run: |
          gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Ala-Noor-Android
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
