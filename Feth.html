<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سورة الفتح - نور على نور</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 12px;
      background: #f8f5ed;
      color: #333;
      line-height: 2;
    }

    .surah {
      background: white;
      max-width: 700px;
      margin: 15px auto;
      padding: 20px 15px;
      border-radius: 15px;
      box-shadow: 0 2px 8px #00000012;
    }

    h1 { color: #5b4636; }
    .riwaya { color: #806044; font-weight: bold; }

    .button {
      display: inline-block;
      margin: 8px 4px;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: #806044;
      color: white;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .done { background: #39734b; }

    .status {
      padding: 10px;
      background: #f8f5ed;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="surah">
    <h1>سورة الفتح</h1>
    <p class="riwaya">رواية ورش عن نافع</p>

    <p>
      افتحي المصحف واستمعي إلى التلاوة مع متابعة الآيات.
    </p>

    <a class="button"
       href="https://quranpedia.net/surah/4/48/text"
       target="_blank" rel="noopener">
      📖 المصحف والتلاوة
    </a>

    <p id="status" class="status">لم تُسجَّل القراءة بعد.</p>

    <button class="button done" onclick="markDone()">
      ✓ تمّت القراءة
    </button>

    <p>
      <a class="button" href="home.html">← الرجوع إلى الورد</a>
    </p>

    <p>نور على نور<br>بالقرآن نرتقي، وبالصلاة يطمئن القلب.</p>
  </div>

  <script>
    const key = "feth_reading_completed";

    function showStatus() {
      document.getElementById("status").textContent =
        localStorage.getItem(key) === "yes"
          ? "الحمد لله، سجّلتِ إتمام سورة الفتح."
          : "لم تُسجَّل القراءة بعد.";
    }

    function markDone() {
      localStorage.setItem(key, "yes");
      showStatus();
    }

    showStatus();
  </script>
</body>
</html>
