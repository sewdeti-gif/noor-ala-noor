<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سورة الواقعة - نور على نور</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f8f5ed;
  color: #333;
  margin: 0;
  padding: 16px 10px;
  line-height: 2.2;
  text-align: center;
}

.surah {
  max-width: 750px;
  margin: auto;
  padding: 20px 14px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 2px 8px #00000012;
}

h1 { color: #5b4636; }

.riwaya {
  color: #806044;
  font-weight: bold;
}

.player {
  position: sticky;
  top: 0;
  background: #f8f5ed;
  padding: 12px 5px;
  border-radius: 12px;
  z-index: 2;
}

audio {
  width: 100%;
  display: block;
}

#quran {
  font-family: "Traditional Arabic", serif;
  font-size: 25px;
  line-height: 2.2;
  text-align: justify;
  padding: 12px;
}

.ayah { margin: 0 3px; }

.button {
  display: inline-block;
  margin: 10px 4px;
  padding: 10px 18px;
  border: 0;
  border-radius: 20px;
  background: #806044;
  color: white;
  text-decoration: none;
  font-size: 16px;
  cursor: pointer;
}

.done { background: #39734b; }

#status {
  background: #f8f5ed;
  padding: 8px;
  border-radius: 10px;
}
</style>
</head>

<body>
<main class="surah">

<h1>سورة الواقعة</h1>
<p class="riwaya">رواية ورش عن نافع</p>

<div class="player">
  <p>تلاوة الشيخ محمود خليل الحصري — ورش</p>

  <audio
    id="surahAudio"
    controls
    preload="metadata"
    src="./056.mp3?v=2">
    متصفحك لا يدعم تشغيل الصوت.
  </audio>
</div>

<h2>المصحف</h2>

<div id="quran">
  جارٍ تحميل آيات سورة الواقعة...
</div>

<p id="status">
  لم تُسجَّل القراءة بعد.
</p>

<button class="button done" onclick="markDone()">
  ✓ تمّت القراءة
</button>

<p>
  <a class="button" href="home.html">
    ← الرجوع إلى الورد
  </a>
</p>

<p>
  نور على نور<br>
  بالقرآن نرتقي، وبالصلاة يطمئن القلب.
</p>

</main>

<script>
const readingKey = "waqiah_reading_completed";
const positionKey = "waqiah_audio_position";

const audio = document.getElementById("surahAudio");

function savePosition() {
  if (
    Number.isFinite(audio.currentTime) &&
    audio.currentTime > 0
  ) {
    localStorage.setItem(
      positionKey,
      String(audio.currentTime)
    );
  }
}

audio.addEventListener("loadedmetadata", function () {
  const saved = Number(
    localStorage.getItem(positionKey) || 0
  );

  if (
    Number.isFinite(saved) &&
    saved > 0 &&
    Number.isFinite(audio.duration) &&
    saved < audio.duration - 3
  ) {
    audio.currentTime = saved;
  }
});

audio.addEventListener("timeupdate", savePosition);
audio.addEventListener("pause", savePosition);

audio.addEventListener("ended", function () {
  localStorage.removeItem(positionKey);
});

async function loadQuran() {
  const box = document.getElementById("quran");

  try {
    const response = await fetch(
      "https://api.quranpedia.net/v1/mushafs/4/56"
    );

    if (!response.ok) {
      throw new Error("تعذّر تحميل المصحف");
    }

    const data = await response.json();

    const ayahs = Array.isArray(data)
      ? data
      : (data.data || data.verses || []);

    if (!ayahs.length) {
      throw new Error("لم تُعثر على الآيات");
    }

    box.replaceChildren();

    ayahs.forEach(ayah => {
      if (ayah.text) {
        const span = document.createElement("span");
        span.className = "ayah";
        span.textContent =
          ayah.text + " ۝ ";
        box.appendChild(span);
      }
    });

  } catch (error) {
    box.textContent =
      "تعذّر تحميل نص المصحف. تحققي من اتصال الإنترنت.";
  }
}

function showStatus() {
  document.getElementById("status").textContent =
    localStorage.getItem(readingKey) === "true"
      ? "الحمد لله، سجّلتِ إتمام سورة الواقعة."
      : "لم تُسجَّل القراءة بعد.";
}

function markDone() {
  localStorage.setItem(readingKey, "true");
  showStatus();
}

loadQuran();
showStatus();
</script>

</body>
</html>
