<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وردك القرآني</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 15px;
      background: #f8f5ed;
      color: #333;
    }

    .back {
      display: block;
      max-width: 500px;
      margin: 0 auto 15px;
      text-align: right;
    }

    .back a {
      color: #806044;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    h1 {
      margin-bottom: 5px;
      color: #5b4636;
    }

    .subtitle {
      margin-bottom: 8px;
      color: #777;
    }

    .riwaya {
      margin-bottom: 25px;
      color: #806044;
      font-weight: bold;
    }

    .surah {
      background: white;
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .surah h2 {
      margin: 0 0 8px;
      color: #806044;
    }

    .surah h3 {
      margin: 5px 0;
    }

    .surah p {
      margin: 8px 0;
    }

    .surah a {
      color: #806044;
      text-decoration: none;
      font-weight: bold;
    }

    .done {
      display: none;
      margin-top: 12px;
      padding: 9px 22px;
      border: none;
      border-radius: 20px;
      background: #806044;
      color: white;
      font-size: 15px;
    }

    .done.show {
      display: inline-block;
    }

    .done.completed {
      background: #5f7d5f;
    }

    .notifications {
      max-width: 500px;
      margin: 30px auto 10px;
      padding: 15px;
      background: #eee8dc;
      border-radius: 15px;
    }

    .notifications p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <div class="back">
    <a href="javascript:history.back()">← رجوع</a>
  </div>

  <h1>وردك القرآني
